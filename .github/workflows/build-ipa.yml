name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          ls -la

      - name: Build .app (no signing)
        run: |
          set -eux
          xcodebuild \
            -project DylibLab.xcodeproj \
            -scheme DylibLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          echo "--- products ---"
          find build -maxdepth 4 -type d -name "*.app" | head -20
          ls -lh build/Build/Products/Release-iphoneos/

      - name: Package unsigned IPA
        run: |
          set -eux
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf Payload DylibLab-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          APPNAME=$(basename "$APP")
          # Встройка dylib из Inject/ чтобы Sideloadly подписал всё одним сертом
          if ls Inject/*.dylib 1>/dev/null 2>&1; then
            mkdir -p "Payload/$APPNAME/Frameworks"
            cp -v Inject/*.dylib "Payload/$APPNAME/Frameworks/"
          else
            echo "Inject/*.dylib нет — пропускаю встройку"
          fi
          zip -r DylibLab-unsigned.ipa Payload
          ls -lh DylibLab-unsigned.ipa
          # Инфо для лога
          unzip -l DylibLab-unsigned.ipa | head -40

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DylibLab-unsigned-ipa
          path: DylibLab-unsigned.ipa
          if-no-files-found: error

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DylibLab build ${{ github.run_number }}
          body: |
            DylibLab — тестовый стенд для .dylib менюшек (landscape + логи).
            Unsigned IPA для подписи через Sideloadly / AltStore / TrollStore / codesign.
            Commit: ${{ github.sha }}
          files: DylibLab-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
